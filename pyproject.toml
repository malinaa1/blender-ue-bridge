[project]
name = "blender-ue-bridge"
version = "0.1.0"
description = "AI-driven Blender ↔ Unreal Engine bridge via MCP protocol"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]
